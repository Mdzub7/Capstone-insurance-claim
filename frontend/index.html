<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Insurance Claim</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>New Insurance Claim</h1>
            <p>Please fill out the details below and upload your medical report.</p>
            
            <form id="claimForm">
                <div class="form-group">
                    <label for="userId">Patient ID</label>
                    <input type="text" id="userId" value="user123" required>
                </div>
                
                <div class="form-group">
                    <label for="policyNumber">Policy Number</label>
                    <input type="text" id="policyNumber" value="POL-9999" required>
                </div>

                <div class="form-group">
                    <label for="amount">Claim Amount ($)</label>
                    <input type="number" id="amount" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="description">Description of Incident</label>
                    <textarea id="description" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label for="file">Medical Report (PDF)</label>
                    <input type="file" id="file" accept="application/pdf">
                </div>

                <button type="submit">Submit Claim</button>
            </form>
            <div id="message" style="margin-top:20px; font-weight:bold;"></div>
        </div>

        <div class="card">
            <h2>My Recent Claims</h2>
            <div id="claimsList">Loading...</div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
