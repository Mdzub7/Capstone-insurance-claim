<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register • Cigna Claims</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="card" role="form" aria-labelledby="regTitle">
      <h1 id="regTitle">Create Account</h1>
      <form id="registerForm" autocomplete="off" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input id="name" type="text" required aria-required="true" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" required aria-required="true" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" required aria-required="true" minlength="8" />
          <small id="strength" aria-live="polite"></small>
        </div>
        <button type="submit">Register</button>
        <div id="registerMessage" style="margin-top:20px; font-weight:bold;"></div>
      </form>
      <p style="margin-top:16px;">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>
  <script src="js/register.js"></script>
</body>
</html>
