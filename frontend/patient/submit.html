<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Claim</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Submit Claim</h1>
      <form id="submitForm" novalidate>
        <div class="form-group">
          <label for="policyNumber">Policy Number</label>
          <input id="policyNumber" type="text" required />
        </div>
        <div class="form-group">
          <label for="amount">Claim Amount ($)</label>
          <input id="amount" type="number" step="0.01" required />
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label for="file">Medical Report (PDF)</label>
          <input id="file" type="file" accept="application/pdf" />
        </div>
        <button type="submit">Submit</button>
        <div id="uploadMsg" style="margin-top:20px; font-weight:bold;"></div>
      </form>
    </div>
  </div>
  <script src="patient.js"></script>
</body>
</html>
